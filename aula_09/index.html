<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 09</title>
    <!-- css interno -->
    <link rel="stylesheet" href="./assets/css/style.css" />

    <!-- goole fontes - montsserat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- boostrap cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />

    <!-- bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <h3>Minhas músicas</h3>
    <div class="lista-musicas">
      <div class="musica">
        <div class="topo-card-musica">
          <i class="bi bi-chevron-down"></i>
          <h4>Now playing</h4>
          <i class="bi bi-three-dots"></i>
        </div>
        <img src="./assets/img/rock.jpg" alt="Imagem de uma banda de rock" />
        <h5>Beauz & Jvna - Crazy</h5>
        <h6>NCS Release</h6>
        <div class="controle-musica">
          <audio
            controls
            src="./assets/audio/Aventure - Evening Tone (freetouse.com).mp3"
          ></audio>
        </div>

        <div class="rodape-card-musica">
          <i class="bi bi-repeat-1"></i>
          <i class="bi bi-skip-start-fill"></i>
          <i class="bi bi-play-circle-fill"></i>
          <i class="bi bi-skip-end-fill"></i>
          <i class="bi bi-music-note-list"></i>
        </div>
      </div>
      <div class="musica">
        <div class="topo-card-musica">
          <i class="bi bi-chevron-down"></i>
          <h4>Now playing</h4>
          <i class="bi bi-three-dots"></i>
        </div>
        <img src="./assets/img/rock.jpg" alt="Imagem de uma banda de rock" />
        <h5>Beauz & Jvna - Crazy</h5>
        <h6>NCS Release</h6>
        <div class="rodape-card-musica">
          <i class="bi bi-repeat-1"></i>
          <i class="bi bi-skip-start-fill"></i>
          <i class="bi bi-play-circle-fill"></i>
          <i class="bi bi-skip-end-fill"></i>
          <i class="bi bi-music-note-list"></i>
        </div>
      </div>
      <div class="musica">
        <div class="topo-card-musica">
          <i class="bi bi-chevron-down"></i>
          <h4>Now playing</h4>
          <i class="bi bi-three-dots"></i>
        </div>
        <img src="./assets/img/rock.jpg" alt="Imagem de uma banda de rock" />
        <h5>Beauz & Jvna - Crazy</h5>
        <h6>NCS Release</h6>
        <div class="rodape-card-musica">
          <i class="bi bi-repeat-1"></i>
          <i class="bi bi-skip-start-fill"></i>
          <i class="bi bi-play-circle-fill"></i>
          <i class="bi bi-skip-end-fill"></i>
          <i class="bi bi-music-note-list"></i>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

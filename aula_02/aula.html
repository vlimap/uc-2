<body>
    <h3>Poemas de amor</h3>
    <p>
        Amor não se transforma de hora em hora,<br>
        Antes se afirma para a eternidade.<br>
        Se isso é falso, e que é falso alguém provou,<br>
        Eu não sou poeta, e ninguém nunca amou.
    </p>

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário de Cadastro - Senac</title>

    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <header>
      <img src="./assets/img/senac-topo.png" alt="Cabeçalho Senac" />
    </header>

    <main>
      
      <div class="form-cadastro">
        <h3>Formulário Senac</h3>
        <form action="" method="get">
          <div class="uma-coluna">
            <label for="nome">Nome completo (Sem abreviações, conforme documento deidentificação)</label>
            <input type="text" id="nome" name="nome" required />
          </div>
          <div class="duas-colunas">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" required />

            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento" name="nascimento" required />
          </div>
          <div class="duas-colunas">
            <label for="telefone">Contato telefônico (DDD)</label>
            <input type="tel" id="telefone" name="telefone" required />

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" />
          </div>
          <div class="duas-colunas">
            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep" />

            <label for="rua">Rua</label>
            <input type="text" id="rua" name="rua" />
          </div>
          <div class="tres-colunas">
            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero" />

            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" name="complemento" />

            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" name="bairro" />
          </div>
          <div class="duas-colunas">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" />

            <label for="estado">Estado (UF)</label>
            <input type="text" id="estado" name="estado" />
          </div>
          <div class="tres-colunas">
            <label for="escolaridade">Escolaridade</label>
            <select id="escolaridade" name="escolaridade" required>
              <option value="">Selecione uma opção</option>
              <option value="fundamental">Ensino Fundamental</option>
              <option value="medio">Ensino Médio</option>
              <option value="superior">Ensino Superior</option>
            </select>

            <label for="sexo">Sexo</label>
            <select id="sexo" name="sexo">
              <option value="">Selecione uma opção</option>
              <option value="masculino">Masculino</option>
              <option value="feminino">Feminino</option>
            </select>

            <label for="raca">Raça/Cor</label>
            <select id="raca" name="raca">
              <option value="">Selecione uma opção</option>
              <option value="branca">Branca</option>
              <option value="preta">Preta</option>
              <option value="parda">Parda</option>
              <option value="amarela">Amarela</option>
              <option value="indigena">Indígena</option>
            </select>
          </div>
          <button type="submit">Enviar</button>
        </form>
      </div>
    </main>
  </body>
</html>
